<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to Words Converter</title>
    <link rel="stylesheet" href="style_num.css">
    <script src="script_num.js" defer></script>
</head>
<body> 
    <a href="index.html" class="home-btn">Home</a>
    <div class="num_to_words">
        <h1 class="h_num">Number to Words Converter</h1>
        <input type="text" id="numberInput" placeholder="Enter number">
        <button id="numConvertButton">Convert to Words</button>
    </div>
    <p class="result_n"id="numResult"></p>
    <div class="words_to_num">
        <h1 class="h_words">Words to Number Converter</h1>
        <input type="text" id="wordsInput" placeholder="Enter number in words">
        <button id="wordConvertButton">Convert to Number</button>
    </div>
    <p class="result_w" id="wordsResult"></p>
</body>
</html>
