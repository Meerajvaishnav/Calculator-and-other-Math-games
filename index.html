<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator & Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="h1">Calculator + Other Math Games</h1>

<div class="container">
    <div class="calculator">
        <input type="text" id="display" disabled>

        <div class="buttons">
            <button class="clear-btn" onclick="clearDisplay()">C</button>
            <button class="num-btn" onclick="backspace()">⌫</button>
            <button class="num-btn" onclick="append('.')">.</button>
            <button class="op-btn" onclick="append('/')">/</button>

            <button class="num-btn" onclick="append('7')">7</button>
            <button class="num-btn" onclick="append('8')">8</button>
            <button class="num-btn" onclick="append('9')">9</button>
            <button class="num-btn" onclick="append('*')">*</button>

            <button class="num-btn" onclick="append('4')">4</button>
            <button class="num-btn" onclick="append('5')">5</button>
            <button class="num-btn" onclick="append('6')">6</button>
            <button class="num-btn" onclick="append('-')">-</button>

            <button class="num-btn" onclick="append('1')">1</button>
            <button class="num-btn" onclick="append('2')">2</button>
            <button class="num-btn" onclick="append('3')">3</button>
            <button class="num-btn" onclick="append('+')">+</button>

            <button class="zero num-btn" onclick="append('0')" class="zero">0</button>
            <button class="equals-btn" onclick="calculate()">=</button>
            <button class="game-btn" onclick="startGame()">Game</button>
        </div>
    </div>

    <div class="game" id="game">
        <h2 class="h2">Math Puzzle Game</h2>
        <p id="question"></p>
        <input type="number" id="answer" step="any">
        <button onclick="checkAnswer()" class="g-btn">Submit</button>
        <p class="p">Score: <span id="score">0</span></p>
        <button onclick="exitGame()" class="g-btn">Exit Game</button>
    </div>

</div>
<div class="more-btns">
    <button onclick="window.location.href='num_to_words.html'">
        Number to Words
    </button>
    <button onclick="window.location.href='sudokku.html'">
        Sudokku
    </button>
    <button onclick="window.location.href='scientific.html'">
       Scientific Calculator
    </button>
</div>
<script src="script.js"></script>
</body>
</html>
