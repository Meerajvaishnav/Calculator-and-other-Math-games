<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator & Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="h1">Calculator & Math Games</h1>

<div class="container">
    <div class="calculator">
        <input type="text" id="display" disabled>

        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="backspace()">⌫</button>
            <button onclick="append('.')">.</button>
            <button onclick="append('/')">/</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('*')">*</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('-')">-</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('+')">+</button>

            <button onclick="append('0')" class="zero">0</button>
            <button onclick="calculate()">=</button>
            <button class="game-btn" onclick="startGame()">Game</button>
        </div>
    </div>

    <div class="game" id="game">
        <h2 class="h2">Math Puzzle Game</h2>
        <p id="question"></p>
        <input type="number" id="answer" step="any">
        <button onclick="checkAnswer()" class="g-btn">Submit</button>
        <p id="result"></p>
        <p class="p">Score: <span id="score">0</span></p>
        <button onclick="exitGame()" class="g-btn">Exit Game</button>
    </div>

</div>
<div class="more-btns">
    <button class="btn1"onclick="window.location.href='num_to_words.html'">
        Number to Words
    </button>
    <button class="btn2" onclick="window.location.href='sudokku.html'">
        Sudokku
    </button>
</div>
<script src="script.js"></script>
</body>
</html>
