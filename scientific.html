<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="sci_style.css">
    <script src="sci_script.js" defer></script>
</head>
<body>
<a href="index.html" class="home-btn">Home</a>  
<h1 class="h1">Scientific Calculator</h1>

<div class="container">
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button onclick="setOperation('sin')">sin</button>
            <button onclick="setOperation('cos')">cos</button>
            <button onclick="setOperation('tan')">tan</button>
            <button onclick="setOperation('log')">log</button>

            <button onclick="setOperation('sqrt')">√</button>
            <button onclick="setOperation('square')">x²</button>
            <button onclick="append(Math.PI)">π</button>
            <button onclick="clearDisplay()">C</button>

            <button onclick="backspace()">⌫</button>
            <button onclick="append('/')">/</button>
            <button onclick="append('*')">*</button>
            <button onclick="append('-')">-</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('+')">+</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('.')">.</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="calculate()">=</button>

            <button onclick="append('0')" class="zero">0</button>
            <button class="zero" onclick="startStrings()">String operations</button>
        </div>
    </div>
</div>
</body>
</html>
